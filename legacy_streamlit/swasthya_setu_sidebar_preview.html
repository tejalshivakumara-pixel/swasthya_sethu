<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swasthya Setu - Healthcare Portal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="relative w-full max-w-6xl h-[740px] bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 flex overflow-hidden shadow-2xl">
    
    <!-- SIDEBAR NAV -->
    <div id="sidebar-wrapper" class="h-full w-[270px] shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 flex flex-col">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 px-2 py-2 mb-4">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white flex items-center justify-center shadow-lg shadow-emerald-500/25">
          <i data-lucide="heart" class="w-5 h-5 fill-white text-white"></i>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-[17px] tracking-tight text-slate-900 dark:text-slate-100">
            Swasthya<span class="text-emerald-600 dark:text-emerald-400">Setu</span>
          </span>
          <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Health Portal</span>
        </div>
      </div>

      <!-- Navigation Section -->
      <div class="flex-1 overflow-y-auto space-y-4">
        <div class="space-y-1">
          <div class="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">Navigation</div>

          <button onclick="setActiveNav('home', 'Dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-emerald-600 text-white shadow-md shadow-emerald-600/20">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
          </button>

          <button onclick="setActiveNav('symptom_checker', 'AI Symptom Checker')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <span class="flex items-center gap-3">
              <i data-lucide="stethoscope" class="w-4 h-4 text-emerald-600"></i> AI Symptom Checker
            </span>
            <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800">AI</span>
          </button>

          <button onclick="setActiveNav('app', 'Doctor Appointments')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <i data-lucide="calendar" class="w-4 h-4 text-emerald-600"></i> Doctor Appointments
          </button>

          <button onclick="setActiveNav('reminders', 'Medicine Reminders')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <span class="flex items-center gap-3">
              <i data-lucide="pill" class="w-4 h-4 text-emerald-600"></i> Medicine Reminders
            </span>
            <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/15 text-emerald-600">3</span>
          </button>

          <button onclick="setActiveNav('records', 'Health Records')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <i data-lucide="file-text" class="w-4 h-4 text-emerald-600"></i> Health Records
          </button>

          <button onclick="setActiveNav('scanner', 'Prescription Scanner')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <i data-lucide="scan-line" class="w-4 h-4 text-emerald-600"></i> Prescription Scanner
          </button>

          <button onclick="setActiveNav('emergency', 'Emergency Help')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-500/10 hover:text-emerald-600">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-red-600"></i> Emergency Help
          </button>
        </div>
      </div>

      <!-- User Footer -->
      <div class="mt-4 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-xs">
          TS
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">Tejal S</span>
          <span class="text-[10px] text-emerald-600 font-medium">Logged In</span>
        </div>
      </div>

    </div>

    <!-- MAIN BODY CONTENT -->
    <div class="flex-1 bg-slate-50/50 dark:bg-slate-950/50 flex flex-col min-w-0">
      <div class="p-6 md:p-8 overflow-y-auto flex-1 flex flex-col gap-6">
        <h2 id="main-heading" class="text-2xl font-bold text-slate-900 dark:text-slate-100">
          Dashboard Overview
        </h2>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function setActiveNav(id, title) {
      document.getElementById('main-heading').innerText = title;
    }
  </script>
</body>
</html>
